name: Run Ansible SIS5

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install Ansible and dependencies
      run: |
        sudo apt update
        sudo apt install -y ansible python3-pip
        pip3 install docker
    
    - name: Display Ansible version
      run: ansible --version
    
    - name: Update inventory to use localhost
      run: |
        cat > sis5_ansible/inventory/hosts.ini << 'EOF'
        [local]
        localhost ansible_connection=local
        EOF
    
    - name: Update playbook to use local host
      run: |
        sed -i 's/hosts: remote_vm/hosts: local/' sis5_ansible/sis5_playbook.yml
    
    - name: Run Ansible playbook on GitHub runner
      run: |
        cd sis5_ansible
        ansible-playbook sis5_playbook.yml -v
      env:
        ANSIBLE_HOST_KEY_CHECKING: "False"
    
    - name: Verify SIS2 users created
      run: |
        getent passwd admin1 auditor1 autobot pguser webuser
    
    - name: Verify SIS3 service
      run: |
        sudo systemctl status sis3 --no-pager || echo "Checking service..."
        sleep 3
        curl -f http://localhost:8081 || echo "Service starting..."
    
    - name: Verify SIS4 Docker container
      run: |
        sudo docker ps -a
        curl -f http://localhost:8082 || echo "Container starting..."
    
    - name: Show deployment summary
      run: |
        echo "🎉 ✅ Ansible CI/CD Pipeline Completed!"
        echo "📦 SIS2: Users and groups configured"
        echo "🚀 SIS3: Go web service deployed"
        echo "🐳 SIS4: Docker weather service deployed"
