name: Run Ansible SIS5

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install Ansible if needed
      run: |
        which ansible || sudo apt install -y ansible
    
    - name: Display Ansible version
      run: ansible --version
    
    - name: Show current inventory
      run: |
        cat sis5_ansible/inventory/hosts.ini
    
    - name: Show playbook hosts
      run: |
        grep "hosts:" sis5_ansible/sis5_playbook.yml
    
    - name: Run Ansible playbook on local machine
      run: |
        cd sis5_ansible
        ansible-playbook sis5_playbook.yml -v
      env:
        ANSIBLE_HOST_KEY_CHECKING: "False"
    
    - name: Verify SIS2 users created
      run: |
        getent passwd admin1 auditor1 autobot pguser webuser
    
    - name: Verify SIS3 service
      run: |
        sudo systemctl status sis3 --no-pager
        curl -f http://localhost:8081
    
    - name: Verify SIS4 Docker container
      run: |
        sudo docker ps | grep weather_container
        curl -f http://localhost:8082
    
    - name: Show deployment summary
      run: |
        echo "🎉 ✅ Ansible executed on self-hosted runner (your VM)!"
        echo "📦 SIS2: Users configured"
        echo "🚀 SIS3: Service running on port 8081"
        echo "🐳 SIS4: Container running on port 8082"
