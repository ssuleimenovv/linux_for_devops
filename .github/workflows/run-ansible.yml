name: Run Ansible SIS5

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

    - name: Test SSH connection
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo Connected OK"

    - name: Install Ansible on GitHub runner
      run: |
        sudo apt update
        sudo apt install -y ansible

    - name: Run Ansible playbook
      run: |
        ansible-playbook sis5_ansible/sis5_playbook.yml -i sis5_ansible/inventory/hosts.ini

